<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>LUX IA — Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0A0D14;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
    .card{text-align:center;max-width:400px}
    .icon{font-size:3rem;margin-bottom:1rem}
    h1{font-size:1.5rem;margin-bottom:0.5rem;color:#D4A520}
    p{color:#94a3b8;font-size:0.9rem;line-height:1.6;margin-bottom:1.5rem}
    button{background:#D4A520;color:#0A0D14;border:none;padding:0.75rem 1.5rem;border-radius:0.5rem;font-weight:600;cursor:pointer;font-size:0.9rem}
    button:hover{opacity:0.9}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sem conexão</h1>
    <p>Você está offline. Verifique sua conexão com a internet e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
