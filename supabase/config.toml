project_id = "pttzwlbidamibjssqiqb"

[functions.oracle-push-bitrix]
verify_jwt = true

[functions.cnpj-enrich-worker]
verify_jwt = true

# verify_jwt = false: o CI não carrega JWT. O gate é o header x-qa-token, validado
# contra o segredo QA_INGEST_TOKEN ou contra public.qa_ingest_tokens (só hash).
[functions.qa-ingest-run]
verify_jwt = false

[functions.admin-list-companies]
verify_jwt = false

# Functions publicas por design: autenticam por conta propria (assinatura HMAC
# ou X-API-Key) e sao chamadas de fora do Supabase, sem header Authorization.
# Sem esta secao, o deploy aplica o default verify_jwt = true e o gateway
# responde 401 antes do codigo rodar.
#   track-open / track-click - pixel e redirect de email (verifyTrackingParams)
#   public-api               - API de clientes, header X-API-Key
#   email-oauth-callback     - retorno do provedor OAuth
#   mcp                      - OAuth proprio do @lovable.dev/mcp-js
[functions.track-open]
verify_jwt = false

[functions.track-click]
verify_jwt = false

[functions.public-api]
verify_jwt = false

[functions.email-oauth-callback]
verify_jwt = false

[functions.mcp]
verify_jwt = false

# mcp-query - gateway SQL/admin com gate proprio (header x-mcp-secret comparado
# com o secret MCP_SECRET). Roda com verify_jwt = false porque quem chama e um
# cliente MCP externo sem Authorization do Supabase; o gate esta no codigo.
# Sem esta secao o deploy aplica verify_jwt = true e o gateway responde 401
# antes do codigo rodar.
[functions.mcp-query]
verify_jwt = false
# Envio dos relatorios agendados. Chamada por pg_cron com a service_role key
# vinda do vault; o gate efeito esta em cron-auth (isCronAuthorized), nao no
# verify_jwt do gateway.
[functions.send-scheduled-reports]
verify_jwt = false

# SCIM 2.0 - IdPs (Okta, Azure AD) chamam com Bearer token SCIM proprio
# (nao um JWT do Supabase). O gate esta no codigo (verify_scim_token RPC).
# Sem esta secao o gateway responde 401 antes do codigo rodar.
[functions.scim]
verify_jwt = false

# hubspot-sync - invocado por cron (CRON_SERVICE_KEY) ou por admin logado.
# O gate esta no codigo (isCronAuthorized + checagem de role admin).
[functions.hubspot-sync]
verify_jwt = false

# ---------------------------------------------------------------------------
# Restante das functions publicadas no projeto. O valor de verify_jwt abaixo e o
# que esta de fato em producao (conferido via API de management do Supabase).
# Ate agora esse gate so existia na configuracao do projeto, nao versionada: um
# deploy por `supabase functions deploy` (que usa este arquivo) aplicaria o
# default verify_jwt = true e derrubaria quem chama sem Authorization.
# ---------------------------------------------------------------------------

# verify_jwt = false (14). Chamadas por pg_cron, pg_net ou de fora do Supabase,
# sempre sem header Authorization do Supabase. O gate fica no codigo de cada
# uma (token de cron / secret proprio).
[functions.campaign-dispatch]
verify_jwt = false

