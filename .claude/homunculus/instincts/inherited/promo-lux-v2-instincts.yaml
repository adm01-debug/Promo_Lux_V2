# Promo Lux V2 Migration Grant RLS

## Action

Todo `CREATE TABLE` em `public` leva `GRANT` e `ALTER TABLE ... ENABLE ROW LEVEL SECURITY` na MESMA migration. E migration é item do dono: PR aberta, sem merge.

## Evidence

- `scripts/check-migrations.sh` regra 5 (estrita para timestamp >= 20260727000000)
- `.github/workflows/db-migrations.yml` aplica `supabase/migrations/**` em produção no push da `main`
