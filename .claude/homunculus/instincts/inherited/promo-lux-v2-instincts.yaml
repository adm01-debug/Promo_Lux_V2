# Promo Lux V2 Multi-tenant withOrg

## Action

Use `import { db } from "@/integrations/supabase/withOrg"`, nunca o client cru. Tabela nova com `organization_id` entra em `ORG_SCOPED_TABLES` e no fixture `org-scoped-tables.fixture.json`.

## Evidence

- `src/integrations/supabase/withOrg.ts:87` (`ORG_SCOPED_TABLES`), `:151` (`ORG_UNSCOPED_TABLES`), `:292` (tabela sem classificação é bloqueada)
- `src/integrations/supabase/__tests__/withOrg.registry.test.ts`

