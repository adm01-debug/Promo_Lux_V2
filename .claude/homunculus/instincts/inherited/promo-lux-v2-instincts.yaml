# Promo Lux V2 Commit Conventional

## Action

Use Conventional Commits in PT-BR: `<tipo>(<escopo>): <assunto>` — tipos `feat fix docs style refactor perf test build ci chore revert`.

## Evidence

- `@commitlint/config-conventional` em `package.json` (devDependencies) e em `commitlint.config.cjs`/`commitlint.config.js`
- `CONTRIBUTING.md` › "Commits Semânticos"
- Nenhum hook `commit-msg` em `.husky/` — a convenção não é cobrada automaticamente

