# Promo Lux V2 Test Location

## Action

Teste de front em `__tests__/` ao lado do módulo (projeto `app`, jsdom); teste de edge function em `supabase/functions/**/__tests__/` (projeto `edge`, node). Ambos Vitest. E2E em `e2e/` (Playwright).

## Evidence

- `vitest.config.ts`: projeto `app` com `include: ["src/**/*.{test,spec}.{ts,tsx}"]`; projeto `edge` com `include: ["supabase/functions/**/__tests__/**/*.test.ts"]`
- 4 arquivos Deno-nativos excluídos de propósito no mesmo arquivo

