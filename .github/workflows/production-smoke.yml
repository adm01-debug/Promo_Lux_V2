name: Production Smoke Test

# Verifica que o bundle servido em produção contém as páginas principais
# (Admin/CNPJ/Monitoring). Produção = Vercel (projeto juca1/promo-lux-v2),
# deploy automático por merge em main. Um simples "HTTP 200" engana porque o
# SPA responde 200 em qualquer rota — detecção via marcadores estáveis do
# entry JS (strings persistidas no código, presentes no dist da main).

on:
  schedule:
    # 09:00 UTC = 06:00 America/Sao_Paulo (todos os dias)
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production bundle markers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch production entry and check markers
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://promo-lux-v2.vercel.app"
          HTML=$(curl -fsSL "$BASE/")
          # entry JS: <script ... src="/assets/index-<hash>.js">
          ENTRY=$(printf '%s' "$HTML" | grep -oE '"/assets/index-[^"]+\.js"' | head -1 | tr -d '"')
          if [ -z "$ENTRY" ]; then
            echo "::error::entry JS não encontrado no HTML de produção"
            exit 1
          fi
          echo "entry: $ENTRY"
          BUNDLE=$(curl -fsSL "$BASE$ENTRY")
          printf '%s' "$BUNDLE" > /tmp/bundle.js
          FAILED=0
          for MARKER in "admin/companies" "settings/cnpj" "Monitoring"; do
            if grep -qF "$MARKER" /tmp/bundle.js; then
              echo "OK: $MARKER presente"
            else
              echo "::error::marcador '$MARKER' AUSENTE — produção provavelmente defasada vs main"
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Check edge functions CORS allowlist (Vercel origin)
        shell: bash
        run: |
          set -euo pipefail
          # Cada edge function com allowlist restritiva DEVE devolver ACAO com o
          # dominio de producao (Vercel). Sem isto, o browser bloqueia a chamada.
          # Funcoes wildcard (ACAO: *) sao permitidas por desenho.
          FUNCTIONS="health admin-list-companies ai-agent auth-rate-limit gmaps-proxy lusha-cookie-health lusha-decision-makers lusha-reveal lusha-search oracle-cookies-preflight oracle-enrich-contact oracle-push-bitrix oracle-search-decisors rls-tests workflow-engine"
          ORIGIN="https://promo-lux-v2.vercel.app"
          FAILED=0
          for FN in $FUNCTIONS; do
            A_LINE=$(curl -fsSL -o /dev/null -D - -X OPTIONS "https://pttzwlbidamibjssqiqb.supabase.co/functions/v1/$FN" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" 2>/dev/null | tr -d "\r" | grep -i "^access-control-allow-origin:" | head -1)
            ACAO=${A_LINE#*: }
            ACAO=${ACAO//$'\r'/}
            if [ "$ACAO" = "$ORIGIN" ]; then
              echo "OK: $FN -> $ACAO"
            elif [ "$ACAO" = "*" ]; then
              echo "OK: $FN -> wildcard (por desenho)"
            else
              # ACAO diferente da origem (ex.: dominio legado) = browser bloqueia
              echo "::error::$FN devolve ACAO '$ACAO' - allowlist sem o dominio de producao"
              FAILED=1
            fi
          done
          exit "$FAILED"