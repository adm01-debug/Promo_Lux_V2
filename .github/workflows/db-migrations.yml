name: Database Migrations

# ---------------------------------------------------------------------------
# Fluxo oficial de migrações do LUX IA.
#
# Princípios de desenho (por que este workflow é assim):
#
#  1. O ambiente NUNCA é escolhido por um input livre. Ele é derivado do
#     gatilho: pull_request -> staging (somente validação), push em main ->
#     production (aplica). Isso elimina a classe de erro "rodei a migration
#     no banco errado".
#  2. Credenciais vivem em GitHub Environments (`staging` / `production`),
#     não em secrets de repositório. O Environment `production` deve ter
#     "Required reviewers" ativado, então nenhuma migration chega em prod sem
#     aprovação humana explícita.
#  3. Nada de SQL arbitrário vindo de fora. A única fonte de verdade é o
#     conteúdo versionado de `supabase/migrations/`, revisado em PR.
#  4. Toda execução em produção é precedida de um `--dry-run`, que imprime
#     exatamente o que será aplicado antes de aplicar.
# ---------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrations.yml'
  push:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo (execução manual)'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  # Serializa migrações por ambiente. Duas aplicações simultâneas no mesmo
  # banco geram estado inconsistente em `supabase_migrations.schema_migrations`.
  group: db-migrations-${{ github.event_name == 'pull_request' && 'staging' || (inputs.environment || 'production') }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Lint estático — roda sem tocar em nenhum banco, sem secrets.
  # -------------------------------------------------------------------------
  lint:
    name: Lint das migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar nomes, ordem e conteúdo das migrations
        run: bash scripts/check-migrations.sh

  # -------------------------------------------------------------------------
  # 2. Shadow database — aplica TODAS as migrations do zero num Postgres
  #    efêmero. Pega migration quebrada, ordem errada e dependência faltando
  #    antes de qualquer banco real ser tocado.
  # -------------------------------------------------------------------------
  shadow:
    name: Replay em banco efêmero
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: v3.1.0

      - name: Subir Supabase local e aplicar migrations do zero
        run: |
          echo "▶ Aplicando $(ls supabase/migrations/*.sql | wc -l) migrations em banco limpo..."
          supabase db start
          supabase migration up --local
          echo "✅ Replay completo sem erros."

      - name: Verificar drift entre migrations e schema resultante
        run: |
          DIFF=$(supabase db diff --local --schema public || true)
          if [ -n "$DIFF" ]; then
            echo "::error::Drift detectado — o schema gerado não bate com as migrations:"
            echo "$DIFF"
            exit 1
          fi
          echo "✅ Sem drift."

  # -------------------------------------------------------------------------
  # 3. Plano (dry-run) contra o banco alvo. Em PR o alvo é SEMPRE staging.
  # -------------------------------------------------------------------------
  plan:
    name: Plano contra ${{ github.event_name == 'pull_request' && 'staging' || (inputs.environment || 'production') }}
    runs-on: ubuntu-latest
    needs: shadow
    environment:
      name: ${{ github.event_name == 'pull_request' && 'staging' || (inputs.environment || 'production') }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: v3.1.0

      - name: Guarda de ambiente (o ref precisa bater com o esperado)
        run: bash scripts/check-migration-target.sh

      - name: Link no projeto alvo
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry-run (nada é aplicado aqui)
        run: |
          echo "▶ Migrations pendentes em $SUPABASE_PROJECT_REF:"
          supabase migration list --linked
          supabase db push --dry-run --linked

  # -------------------------------------------------------------------------
  # 4. Apply — só em push na main ou dispatch manual. Nunca em PR.
  #    O Environment `production` exige aprovação de reviewer.
  # -------------------------------------------------------------------------
  apply:
    name: Aplicar em ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: https://supabase.com/dashboard/project/${{ vars.SUPABASE_PROJECT_REF }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: v3.1.0

      - name: Guarda de ambiente
        run: bash scripts/check-migration-target.sh

      - name: Link no projeto alvo
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar migrations
        run: supabase db push --linked

      - name: Estado final do histórico
        run: supabase migration list --linked
