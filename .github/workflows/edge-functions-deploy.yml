name: Edge Functions Deploy

# ---------------------------------------------------------------------------
# Fluxo oficial de deploy das Edge Functions do LUX IA (Supabase).
#
# Princípios de desenho (por que este workflow é assim):
#
#  1. O ambiente NUNCA é escolhido por um input livre. Ele é derivado do
#     gatilho: pull_request -> staging (somente validação), push em main ->
#     Production (aplica). Isso elimina a classe de erro "fiz deploy no
#     projeto errado".
#  2. Credenciais vivem em GitHub Environments (`staging` / `Production`),
#     não em secrets de repositório. O Environment `Production` deve ter
#     "Required reviewers" ativado, então nenhum deploy chega em prod sem
#     aprovação humana explícita.
#  3. Em PR nada é publicado: o job `plan` lista o que existe no projeto
#     alvo (staging) e mostra o diff local vs remoto. O deploy só acontece
#     em push na main ou dispatch manual.
#  4. Deploy usa `--use-api` (bundle server-side, sem Docker no runner) e
#     `--yes` (sem isso o CLI aborta quando stdout não é TTY, como já visto
#     no db-migrations). Nada de `--prune`: apagar functions que existem no
#     projeto mas não na main destruiria trabalho em produção de forma
#     irreversível.
#  5. Os testes das functions rodam em `edge-tests-daily.yml` (daily + PR).
#     Este workflow não duplica testes: lint estático + plano + deploy.
# ---------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/edge-functions-deploy.yml'
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      # config.toml carrega verify_jwt por function: sem ele no filtro, uma
      # mudanca de gate (ex.: ligar verify_jwt de um worker) ficaria na main
      # sem nunca ser aplicada em producao.
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo (execução manual)'
        required: true
        type: choice
        options:
          - staging
          - Production

concurrency:
  # Serializa deploys por ambiente. Duas publicações simultâneas no mesmo
  # projeto podem deixar versões intercaladas de functions que compartilham
  # código em _shared.
  group: edge-fn-deploy-${{ github.event_name == 'pull_request' && 'staging' || (inputs.environment || 'Production') }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Lint estático — roda sem tocar em projeto nenhum, sem secrets.
  # -------------------------------------------------------------------------
  lint:
    name: Lint das functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar estrutura das functions
        run: bash scripts/check-functions-lint.sh

  # -------------------------------------------------------------------------
  # 2. Plano (read-only) contra o projeto alvo. Em PR o alvo é SEMPRE staging.
  #    Lista o que está publicado e o que existe localmente, sem escrever nada.
  # -------------------------------------------------------------------------
  plan:
    name: Plano contra staging
    # So roda em PR. Em push/dispatch o inventario read-only e feito dentro do
    # proprio job `apply`, depois da aprovacao humana unica. Antes este job
    # existia tambem em push e usava o environment `Production`, o que fazia o
    # gate de reviewer disparar DUAS vezes por commit na main (plan + apply).
    # Como o plan roda primeiro, a fila parava nele e nenhum deploy chegava a
    # producao: o run 45160431382 ficou 3h30 em `waiting` e o push seguinte
    # (45192365915) nunca criou job. Um push = uma aprovacao = um deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    environment:
      name: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: v3.1.0

      - name: Guarda de ambiente (o ref precisa bater com o esperado)
        run: bash scripts/check-edge-fn-target.sh

      - name: Link no projeto alvo
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Estado atual published vs local (read-only)
        run: |
          echo "► Functions publicadas em $SUPABASE_PROJECT_REF:"
          supabase functions list
          echo "► Functions locais:"
          find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -printf '%f\n' | sort

  # -------------------------------------------------------------------------
  # 3. Apply — só em push na main ou dispatch manual. Nunca em PR.
  #    O Environment `Production` exige aprovação de reviewer.
  # -------------------------------------------------------------------------
  apply:
    name: Deploy em ${{ inputs.environment || 'Production' }}
    runs-on: ubuntu-latest
    # needs: lint, e NAO `needs: plan`. O plan agora so roda em PR, e um job
    # que depende de job pulado tambem e pulado -- em push na main o apply
    # nunca executaria. O inventario read-only roda como step aqui dentro.
    needs: lint
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ inputs.environment || 'Production' }}
      url: https://supabase.com/dashboard/project/${{ vars.SUPABASE_PROJECT_REF }}/functions
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: v3.1.0

      - name: Guarda de ambiente
        run: bash scripts/check-edge-fn-target.sh

      - name: Link no projeto alvo
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Estado atual published vs local (read-only)
        # Era o corpo do antigo job `plan` em push. Mantido aqui para o log
        # continuar mostrando o que vai ser publicado, sem custar uma segunda
        # aprovacao de environment.
        run: |
          echo "► Functions publicadas em $SUPABASE_PROJECT_REF:"
          supabase functions list
          echo "► Functions locais:"
          find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -printf '%f\n' | sort

      - name: Guarda de segredo no corpo das functions
        # Etapa 004 do docs/qa/04-PLANO.md: barra o deploy de function que
        # publique a service_role key no JSON de resposta (caso migrate-helper).
        run: bash scripts/check-no-secret-echo.sh

      - name: Deploy de todas as functions
        # --use-api: bundle server-side, sem Docker no runner (ubuntu-latest).
        # --yes: sem isso o CLI aborta quando stdout não é TTY (runner GH).
        # Sem --prune: functions publicadas mas ausentes da main ficam intactas.
        run: supabase functions deploy --use-api --yes