name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # O inventario semanal abre o PR dele com GITHUB_TOKEN e, por regra do GitHub, esse
  # token nao dispara evento de push/pull_request - logo este workflow nunca rodava no
  # PR do bot e os 3 checks obrigatorios do ruleset de `main` nunca apareciam.
  # workflow_dispatch e a excecao documentada a essa regra.
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps: parte da árvore (next-themes@0.3, react-day-picker@8
        # + date-fns@4) ainda declara peer ranges de React 17/18 e date-fns 2/3,
        # sem ter sido republicada para as versões usadas aqui (React 19,
        # date-fns 4). Funcionam na prática (é assim que o projeto já roda via
        # `bun install`, mais permissivo por padrão) — sem essa flag, um
        # `npm install` limpo aborta com ERESOLVE antes de instalar qualquer
        # coisa.
        run: npm install --legacy-peer-deps

      - name: Lint (ratchet — só falha em novas ocorrências)
        run: node scripts/ci/lint-ratchet.mjs

      - name: TypeScript check
        # tsconfig.json tem "files": [] e só referencia os projetos: `tsc --noEmit`
        # na raiz não verificava NENHUM arquivo. Verifica cada projeto de verdade.
        run: npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json

      - name: Unit & Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan (console.log + hardcoded secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for console.log in production code
        run: |
          echo "▶ Verificando console.log em código de produção"
          VIOLATIONS=$(grep -rn "console\.log" src/ supabase/functions/ \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="__tests__" \
            --exclude-dir="test" \
            --exclude-dir="tests" \
            | grep -v "// console.log" \
            | grep -v ".test." \
            | grep -v ".spec." \
            | grep -v "demoData" \
            | grep -v "resilience/simulator" \
            | grep -v "vite-env.d.ts" \
            | grep -vE 'console\.log\(JSON\.stringify\(' \
            | grep -vE 'console\.log\(line\);?$' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::console.log encontrado em produção (viola ADR-006):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ Nenhum console.log em produção."

      - name: "Guard: segredo no corpo da resposta (edge functions)"
        # Etapa 004 do docs/qa/04-PLANO.md. O caso real era a migrate-helper,
        # que devolvia a service_role key no JSON; o bloco inline antigo olhava
        # so uma linha e nao pegava segredo montado em varias.
        run: bash scripts/check-no-secret-echo.sh

      - name: Check for hardcoded secrets patterns
        # Etapa 005. Amplia o padrao inline antigo (so AKIA e sk_live, so em
        # src/ e supabase/functions/) para 7 regras e escopo src supabase e2e
        # scripts .github; isencao com motivo em scripts/secrets-allowlist.txt.
        run: bash scripts/check-hardcoded-secrets.sh

  db-guards:
    name: Database Guards (Grants/RLS + Audit Triggers)
    runs-on: ubuntu-latest
    # workflow_dispatch so existe em branch do proprio repositorio (fork nao tem dispatch)
    # e exige permissao de escrita - mesma garantia de um PR interno. PR de fork segue fora.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install psql client
        # O mirror padrão dos runners (azure.archive.ubuntu.com) falha de
        # resolução de DNS de forma transitória; usa o repositório oficial
        # do PostgreSQL (PGDG), com hostname próprio e retry por passo.
        run: |
          set -euo pipefail
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::comando falhou 5x: $*" >&2
                return 1
              fi
              echo "tentativa $n falhou, aguardando 10s..." >&2
              sleep 10
            done
          }
          retry sudo install -d /usr/share/postgresql-common/pgdg
          retry sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          retry sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          retry sudo apt-get update
          retry sudo apt-get install -y postgresql-client-16

      - name: Verify function EXECUTE grants (anon/authenticated/service_role)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-function-grants.sh

      - name: Verify audit trigger integrity (1 log_audit_event per table, no duplicates)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-audit-triggers.sh

      - name: Verify v_sec_definer_anon_grants (zero rows = secure)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-anon-grants-view.sh

      - name: Verify SECURITY DEFINER allowlist (ADR-009)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-security-definer.sh

      - name: Verify queue_kind coverage (Round18)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-queue-kind-coverage.sh
