name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit & Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

  db-guards:
    name: Database Guards (Grants/RLS + Audit Triggers)
    runs-on: ubuntu-latest
    # Só executa quando o segredo de conexão estiver configurado no repositório.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify function EXECUTE grants (anon/authenticated/service_role)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/check-function-grants.sh

      - name: Verify audit trigger integrity (1 log_audit_event per table, no duplicates)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/check-audit-triggers.sh
