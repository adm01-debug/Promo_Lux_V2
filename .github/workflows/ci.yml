name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps: parte da árvore (next-themes@0.3, react-day-picker@8
        # + date-fns@4) ainda declara peer ranges de React 17/18 e date-fns 2/3,
        # sem ter sido republicada para as versões usadas aqui (React 19,
        # date-fns 4). Funcionam na prática (é assim que o projeto já roda via
        # `bun install`, mais permissivo por padrão) — sem essa flag, um
        # `npm install` limpo aborta com ERESOLVE antes de instalar qualquer
        # coisa.
        run: npm install --legacy-peer-deps

      - name: Lint (ratchet — só falha em novas ocorrências)
        run: node scripts/ci/lint-ratchet.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit & Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan (console.log + hardcoded secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for console.log in production code
        run: |
          echo "▶ Verificando console.log em código de produção"
          VIOLATIONS=$(grep -rn "console\.log" src/ supabase/functions/ \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="__tests__" \
            --exclude-dir="test" \
            --exclude-dir="tests" \
            | grep -v "// console.log" \
            | grep -v ".test." \
            | grep -v ".spec." \
            | grep -v "demoData" \
            | grep -v "resilience/simulator" \
            | grep -v "vite-env.d.ts" \
            | grep -vE 'console\.log\(JSON\.stringify\(' \
            | grep -vE 'console\.log\(line\);?$' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::console.log encontrado em produção (viola ADR-006):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ Nenhum console.log em produção."

      - name: Check for hardcoded secrets patterns
        run: |
          echo "▶ Verificando padrões de secrets hardcoded..."
          FOUND=0
          if grep -rnE 'AKIA[0-9A-Z]{16}' src/ supabase/functions/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::warning::Padrão AWS Access Key encontrado"
            FOUND=$((FOUND+1))
          fi
          if grep -rnE 'sk_live_[A-Za-z0-9]{20,}' src/ supabase/functions/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::warning::Padrão Stripe Live Key encontrado"
            FOUND=$((FOUND+1))
          fi
          if [ $FOUND -gt 0 ]; then
            echo "::error::$FOUND secret(s) hardcoded detectado(s)."
            exit 1
          fi
          echo "✅ Scan de secrets concluído."

  db-guards:
    name: Database Guards (Grants/RLS + Audit Triggers)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        # O mirror padrão dos runners (azure.archive.ubuntu.com) falha de
        # resolução de DNS de forma transitória; usa o repositório oficial
        # do PostgreSQL (PGDG), com hostname próprio e retry por passo.
        run: |
          set -euo pipefail
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "::error::comando falhou 5x: $*" >&2
                return 1
              fi
              echo "tentativa $n falhou, aguardando 10s..." >&2
              sleep 10
            done
          }
          retry sudo install -d /usr/share/postgresql-common/pgdg
          retry sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          retry sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          retry sudo apt-get update
          retry sudo apt-get install -y postgresql-client-16

      - name: Verify function EXECUTE grants (anon/authenticated/service_role)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-function-grants.sh

      - name: Verify audit trigger integrity (1 log_audit_event per table, no duplicates)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-audit-triggers.sh

      - name: Verify v_sec_definer_anon_grants (zero rows = secure)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-anon-grants-view.sh

      - name: Verify SECURITY DEFINER allowlist (ADR-009)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-security-definer.sh

      - name: Verify queue_kind coverage (Round18)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/check-queue-kind-coverage.sh
