name: Edge Functions Daily Tests (Deno)

# Executa diariamente a bateria de testes Deno das Edge Functions para detectar
# regressões cedo (equivalente CI ao supabase--test_edge_functions da Lovable).
# Também é disparável manualmente e roda em PRs que tocam em supabase/functions/**.

on:
  schedule:
    # 07:00 UTC = 04:00 America/Sao_Paulo (todos os dias)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      pattern:
        description: "Filtro opcional (--filter) do deno test"
        required: false
        default: ""
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-tests-daily.yml"

concurrency:
  group: edge-tests-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-edge-tests:
    name: Deno test suite (supabase/functions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Discover Deno test files (nativos, exclui vitest e rls-tests)
        id: discover
        run: |
          # Este workflow roda `deno test` (suite Deno). Os arquivos *.test.ts que
          # importam vitest sao suite do Node (npm run test/quality-gate) e NAO
          # sao executaveis pelo Deno; inclui-los derruba a suite. A suite rls-tests/
          # exige Supabase local (localhost:54321), inviavel sem ele; por isso ambos
          # sao filtrados da rodada do deno test.
          FILES=$(find supabase/functions \( -name "*_test.ts" -o -name "*.test.ts" \) -not -path "*/node_modules/*" -not -path "*/rls-tests/*" 2>/dev/null | sort)
                    NATIVE=$(printf '%s\n' "$FILES" | while IFS= read -r f; do [ -z "$f" ] || grep -q "vitest" "$f" || printf '%s\n' "$f"; done)
                    COUNT=$(printf '%s\n' "$NATIVE" | grep -c . || true)
          echo "Arquivos de teste Deno nativos:"
          echo "$NATIVE"
                    # Saida em linha unica (espaco-separada): a lista multi-linha quebra a
                    # interpolacao em `run: |` do passo seguinte (cada linha vira comando).
                    FILES_SL=$(printf '%s\n' "$NATIVE" | tr '\n' ' ' | sed 's/ $//')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
                    echo "files=$FILES_SL" >> "$GITHUB_OUTPUT"
          if [ -z "$NATIVE" ]; then
            echo "::warning::Nenhum teste Deno nativo em supabase/functions/** (fora de rls-tests/)"
          fi
      - name: Run Deno tests (nativos)
        if: steps.discover.outputs.count != '0'
        env:
          DENO_TLS_CA_STORE: system
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          APIFY_MOCK_MODE: "true"
          HIKER_MOCK_MODE: "true"
          LOVABLE_API_KEY: "test-lovable-key"
        run: |
          FILTER_ARG=""
          if [ -n "${{ github.event.inputs.pattern }}" ]; then
            FILTER_ARG="--filter=${{ github.event.inputs.pattern }}"
          fi
                # deno test com a lista filtrada (arquivos nativos) em vez do diretorio
                          # inteiro: evita redescobrir os vitest e quebrar com erro interno do Deno.
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --no-check \
            --reporter=pretty \
            $FILTER_ARG \
            ${{ steps.discover.outputs.files }}

      - name: Report failure to Actions summary
        if: failure()
        run: |
          {
            echo "## ❌ Edge Functions Daily Tests falharam"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Rode localmente com: \`deno test --allow-net --allow-env --allow-read supabase/functions/\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rls-tests:
    name: RLS tests (supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      # O CLI 3.1.0 sobe por padrao o gotrue v2.194.0, que rejeita as chaves no
      # formato anotado (sb_publishable_*/sb_secret_*) que o supabase start novo
      # emite -> createUser falha com Invalid API key no job rls-tests.
      # O mecanismo nativo de override da imagem e o pin em supabase/.temp/gotrue-version
      # (leitura do CLI antes do start; a pasta .temp/ e gitignored), entao o job o
      # re-cria para subir o gotrue v2.197.0, que aceita a chave anotada (prova local:
      # createUser HTTP 200 com sb_secret_* em gotrue 2.197).
      - name: Pina gotrue v2.197.0 (aceita chave anotada)
        run: |
          mkdir -p supabase/.temp
          printf 'v2.197.0' > supabase/.temp/gotrue-version

      - name: Start Supabase local (migrations limpas)
        run: supabase start

      - name: Coleta URL e chaves do stack local
        id: supa-env
        run: |
          supabase status --output env > .supa.env
          . ./.supa.env
          {
            echo "url=$API_URL"
                      echo "anon_key=$PUBLISHABLE_KEY"
                      echo "service_key=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Run RLS tests (Deno)
        env:
          DENO_TLS_CA_STORE: system
          APP_ENV: dev
          SUPABASE_URL: ${{ steps.supa-env.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.supa-env.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supa-env.outputs.service_key }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --no-check \
            --reporter=pretty \
            supabase/functions/rls-tests/
